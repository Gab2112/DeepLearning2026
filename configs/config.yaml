# =====================================================================
# CONFIGURAZIONE GENERALE PROGETTO DEEP LEARNING: VEGETATION FORECASTING
# =====================================================================

paths:
  # Percorsi relativi alla radice del progetto
  train_data_dir: "DATA/train_multi_output_clear_sky"
  val_id_data_dir: "DATA/val_chopped_multi_output_clear_sky"
  ood_s_data_dir: "DATA/ood-s_chopped_multi_output_clear_sky"
  ood_t_data_dir: "DATA/ood-t_chopped_multi_output_clear_sky"
  scaler_path: "DATA/train_multi_output_clear_sky/scaler.json"
  checkpoints_dir: "checkpoints"
  results_dir: "results"

data:
  seed: 42
  # Partizionamento per Tile nello split di train (per evitare data leakage)
  num_train_tiles: 70     # Numero di tile geografici per il train dell'imputer (su 84 totali)
  num_val_tiles: 14     # Numero di tile geografici tenuti da parte per validazione
  climate_dropout_p: 0.35 # Probabilità di sostituire il clima noto con <UNKNOWN> durante il training

# ---------------------------------------------------------------------
# Strategia di Interpolazione del Dataset di Addestramento (Factory)
# ---------------------------------------------------------------------
interpolation:
  # Strategie disponibili nel factory:
  # 'linear', 'forward_fill' (locf), 'backward_fill', 'nearest',
  # 'spline' (pchip/cubic), 'mean', 'median', 'constant', 'model' (bigru), 'mae', 'none'
  strategy: "linear"
  target_columns: [18, 19, 20]     # Colonne target storiche da interpolare (NDVI, GNDVI, EVI)
  interpolate_weather: true         # Interpola anche eventuali rari buchi nel meteo (0..17)
  clip_min: -1.0                    # Limite inferiore per indici di vegetazione
  clip_max: 1.0                     # Limite superiore per indici di vegetazione
  spline_kind: "pchip"              # 'pchip' preserva la forma fisica senza overshooting
  model_checkpoint: "checkpoints/history_imputer_best.pt"
  mae_checkpoint: "checkpoints/mae_imputer_best.pt"

# ---------------------------------------------------------------------
# Modello di Imputazione del Passato (Bi-GRU Imputer)
# ---------------------------------------------------------------------
imputer_model:
  input_dim: 27           # 18 meteo/DOY + 3 target sparsi + 3 maschere + 3 orbita/tempo
  climate_dim: 8          # Dimensione dell'embedding per le classi climatiche di Köppen
  hidden_dim: 64
  num_layers: 2
  output_dim: 3           # NDVI, GNDVI, EVI giornalieri
  dropout: 0.1

imputer_training:
  epochs: 10
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  smoothness_weight: 0.05 # Peso della regolarizzazione temporale per evitare salti discontinui
  checkpoint_name: "history_imputer_best.pt"

# ---------------------------------------------------------------------
# Modello di Imputazione Masked Autoencoder (MAE Transformer Imputer)
# ---------------------------------------------------------------------
mae_model:
  input_dim: 27
  climate_dim: 8
  d_model: 64
  nhead: 4
  num_encoder_layers: 3
  num_decoder_layers: 1
  dim_feedforward: 128
  output_dim: 3
  dropout: 0.1

mae_training:
  epochs: 15
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  smoothness_weight: 0.05
  visible_recon_weight: 0.25
  weather_mask_ratio: 0.15
  weather_recon_weight: 0.1
  checkpoint_name: "mae_imputer_best.pt"

# ---------------------------------------------------------------------
# Benchmark unificato di ricostruzione (Bi-GRU vs MAE vs baseline di interpolazione)
# Selezione del modello SOLO sulle tile di validazione ricavate dal train.
# id / ood-s / ood-t sono usati esclusivamente per il report finale.
# ---------------------------------------------------------------------
reconstruction_benchmark:
  models: ["bigru", "mae"]
  seeds: [42]
  epochs: 20
  early_stopping_patience: 6
  eval_batch_size: 512
  baselines: ["linear", "spline", "forward_fill", "backward_fill", "nearest", "mean", "median"]
  output_dir: "results/reconstruction_benchmark"
  frozen_dir: "checkpoints/reconstruction"
  best_overall_checkpoint: "checkpoints/best_reconstruction_imputer.pt"

# ---------------------------------------------------------------------
# Modello di Forecasting Futuro (Predizione multi-step e probabilistica)
# ---------------------------------------------------------------------
forecasting:
  target_names: ["NDVI", "GNDVI", "EVI"]
  future_steps: 3
  quantiles: [0.1, 0.5, 0.9]
  horizon_days_avg: 14
